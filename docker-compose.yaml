services:
  postgres:
    build: ./docker/postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=chinwag
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=adminpassword
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "admin", "-d", "chinwag"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - portfolio_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    restart: unless-stopped
    build:
      context: ./server
      dockerfile: Dockerfile
      target: ${DOCKER_BUILD_TARGET:-dev}
    ports:
      - "127.0.0.1:5560:5560"
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://admin:adminpassword@postgres:5432/chinwag}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portfolio_network
    volumes:
      - ./server/src:/app/src:cached
      - /app/src/generated/prisma

networks:
  portfolio_network:
    driver: bridge

volumes:
  postgres_data:
