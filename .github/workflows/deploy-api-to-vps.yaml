name: Deploy API to VPS

on:
  workflow_dispatch:
    inputs:
      rollback_digest:
        description: Previously verified sha256 digest (leave both fields blank for a fresh build)
        type: string
      rollback_revision:
        description: Commit SHA associated with the rollback digest
        type: string
  push:
    branches: [master]
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/**"
      - "docker-stack.yaml"
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: chinwag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-rollback-inputs:
    if: github.event_name == 'workflow_dispatch' && (inputs.rollback_digest != '' || inputs.rollback_revision != '')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a valid digest and revision together
        shell: bash
        env:
          ROLLBACK_DIGEST: ${{ inputs.rollback_digest }}
          ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
        run: |
          if [[ ! "$ROLLBACK_DIGEST" =~ ^sha256:[a-f0-9]{64}$ || ! "$ROLLBACK_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Provide both a sha256 digest and its 40-character commit SHA."
            exit 1
          fi

  build-client:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5560/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5560
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn build

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Yarn cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-yarn-${{ hashFiles('server/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        working-directory: ./server
        run: yarn install --frozen-lockfile

      - name: Run tests
        working-directory: ./server
        run: yarn test

  build-and-push-image:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && inputs.rollback_digest == '' && inputs.rollback_revision == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    needs:
      - run-tests

    env:
      IMAGE_NAME: ghcr.io/perrysmithmoss/chinwag:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/perrysmithmoss/chinwag
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            Automated release for commit ${{ github.sha }}
            Docker image: ${{ env.IMAGE_NAME }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [build-and-push-image, validate-rollback-inputs]
    if: |
      !cancelled() && github.ref == 'refs/heads/master' &&
      (needs.build-and-push-image.result == 'success' ||
       (needs.build-and-push-image.result == 'skipped' && needs.validate-rollback-inputs.result == 'success'))
    environment: VPS Production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {}
    steps:
      - name: Release verified image through restricted SSH
        shell: bash
        env:
          RELEASE_DIGEST: ${{ inputs.rollback_digest || needs.build-and-push-image.outputs.digest }}
          RELEASE_REVISION: ${{ inputs.rollback_revision || github.sha }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          APP_RELEASE_KEY: ${{ secrets.APP_RELEASE_KEY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RELEASE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ -n "$VPS_KNOWN_HOSTS" && -n "$APP_RELEASE_KEY" ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$APP_RELEASE_KEY" > "$ssh_dir/key"
          unset APP_RELEASE_KEY
          ssh -F /dev/null -nT -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null "chinwag-release@$VPS_HOST" \
            "release $RELEASE_DIGEST $RELEASE_REVISION"

      - name: Verify application endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if (
              status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' https://chinwag-api.perrysmithmoss.com/api/users/me)
              [[ "$status" == 403 ]]
            ); then
              exit 0
            fi
            sleep 5
          done
          exit 1
