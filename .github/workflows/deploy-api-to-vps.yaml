name: Deploy API to VPS

on:
  workflow_dispatch:
    inputs:
      rollback_digest:
        description: Previously verified sha256 digest (leave both fields blank for a fresh build)
        type: string
      rollback_revision:
        description: Commit SHA associated with the rollback digest
        type: string
  push:
    branches: [master]
    paths:
      - "server/**"
      - "client/**"
      - "docker/postgres/**"
      - ".github/workflows/**"
      - "docker-stack.yaml"
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: chinwag-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-rollback-inputs:
    if: github.event_name == 'workflow_dispatch' && (inputs.rollback_digest != '' || inputs.rollback_revision != '')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require a valid digest and revision together
        shell: bash
        env:
          ROLLBACK_DIGEST: ${{ inputs.rollback_digest }}
          ROLLBACK_REVISION: ${{ inputs.rollback_revision }}
        run: |
          if [[ ! "$ROLLBACK_DIGEST" =~ ^sha256:[a-f0-9]{64}$ || ! "$ROLLBACK_REVISION" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Provide both a sha256 digest and its 40-character commit SHA."
            exit 1
          fi

  build-client:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5560/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5560
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn audit --registry https://registry.npmjs.org
      - run: yarn lint
      - run: yarn build

  build-api-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: docker build --platform linux/amd64 -t portfolio-api-test ./server
      - name: Test migrations and authenticated API flows in the built image
        run: sh server/scripts/test-image.sh portfolio-api-test

  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: server/yarn.lock

      - name: Install dependencies
        working-directory: ./server
        run: yarn install --frozen-lockfile

      - name: Audit server dependencies
        working-directory: ./server
        run: yarn audit --registry https://registry.npmjs.org

      - name: Run tests
        working-directory: ./server
        run: yarn test

  build-and-push-image:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && inputs.rollback_digest == '' && inputs.rollback_revision == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    needs:
      - run-tests

    env:
      IMAGE_NAME: ghcr.io/perrysmithmoss/chinwag:${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/perrysmithmoss/chinwag
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=raw,value=latest

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache: true

      - name: Scan the exact release image
        env:
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          image="ghcr.io/perrysmithmoss/chinwag@$RELEASE_DIGEST"
          scanner=aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          docker pull "$image"
          docker save -o "$RUNNER_TEMP/release.tar" "$image"
          mkdir -p "$RUNNER_TEMP/image-scan"
          docker run --rm -v trivy-cache:/root/.cache/trivy -v "$RUNNER_TEMP/release.tar:/image.tar:ro" -v "$RUNNER_TEMP/image-scan:/reports" "$scanner" image --input /image.tar --scanners vuln --format json --output /reports/api.json
          docker run --rm -v trivy-cache:/root/.cache/trivy -v "$RUNNER_TEMP/release.tar:/image.tar:ro" "$scanner" image --input /image.tar --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1

      - name: Upload full release scan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-image-vulnerabilities
          path: ${{ runner.temp }}/image-scan

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Test the scanned release image
        env:
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        run: sh server/scripts/test-image.sh "ghcr.io/perrysmithmoss/chinwag@$RELEASE_DIGEST"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            Automated release for commit ${{ github.sha }}
            Docker image: ${{ env.IMAGE_NAME }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    needs: [build-and-push-image, validate-rollback-inputs]
    if: |
      !cancelled() && github.ref == 'refs/heads/master' &&
      (needs.build-and-push-image.result == 'success' ||
       (needs.build-and-push-image.result == 'skipped' && needs.validate-rollback-inputs.result == 'success'))
    environment: VPS Production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {}
    steps:
      - name: Release verified image through restricted SSH
        shell: bash
        env:
          RELEASE_DIGEST: ${{ inputs.rollback_digest || needs.build-and-push-image.outputs.digest }}
          RELEASE_REVISION: ${{ inputs.rollback_revision || github.sha }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
          APP_RELEASE_KEY: ${{ secrets.APP_RELEASE_KEY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RELEASE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ -n "$VPS_KNOWN_HOSTS" && -n "$APP_RELEASE_KEY" ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$APP_RELEASE_KEY" > "$ssh_dir/key"
          unset APP_RELEASE_KEY
          ssh -F /dev/null -nT -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null "chinwag-release@$VPS_HOST" \
            "release $RELEASE_DIGEST $RELEASE_REVISION"

      - name: Verify application endpoint
        shell: bash
        run: |
          set -euo pipefail
          format='%{http_code} dns=%{time_namelookup}s tcp=%{time_connect}s tls=%{time_appconnect}s first_byte=%{time_starttransfer}s total=%{time_total}s'
          for attempt in {1..6}; do
            curl_exit=0
            result=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out "$format" https://chinwag-api.perrysmithmoss.com/api/users/me) || curl_exit=$?
            printf 'API probe %d: curl_exit=%d HTTP %s\n' "$attempt" "$curl_exit" "$result"
            if [[ "$curl_exit" == 0 && "$result" == '403 '* ]]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
